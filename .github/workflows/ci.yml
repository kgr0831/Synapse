name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: nohup npx vite preview --port 4173 > preview.log 2>&1 &
      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && exit 0
            sleep 1
          done
          echo "preview server never came up:"; cat preview.log; exit 1
      - run: npm run check -- http://localhost:4173
